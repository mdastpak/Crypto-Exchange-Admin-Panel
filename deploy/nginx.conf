# Example server block for the admin panel. TLS settings are omitted; use TLS 1.3 only.
# Restrict access by network (VPN or allow-list) in addition to the backend's admin.allowed_cidrs.
server {
    listen 443 ssl;
    http2 on;
    server_name admin.example.com;
    root /srv/admin-panel/dist;
    index index.html;

    # allow 203.0.113.0/24;   # office or VPN range
    # deny all;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; style-src-elem 'self' 'sha256-47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU=' 'sha256-StEaX+se6YS7pqjzrzMIA0KaX9zF/8zAhvQXZAe5epY=' 'sha256-441zG27rExd4/il+NvIqyL8zFx5XmyNQtE381kSkUJk=' 'sha256-nzTgYzXYDNe6BAHiiI7NNlfK8n/auuOAhh2t92YvuXo='; img-src 'self' data:; font-src 'self'; connect-src 'self' https://admin-api.example.com; manifest-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; require-trusted-types-for 'script'; trusted-types default" always;
    # Keep this line equal to public/_headers: the e2e test runs the build under that file.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), clipboard-read=(), payment=()" always;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header lines are not inherited into a location that sets its own; repeat the block above here.
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }
}
